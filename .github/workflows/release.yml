name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1-0-0

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify the release
        run: |
          test -s index.html && test -s style.css && test -s RELEASE_NOTES.md
          node --check model.js
          node --check script.js
          node --test tests/*.test.cjs
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 is already published'
          else
            gh release create v1.0.0 --target "$GITHUB_SHA" --title 'v1.0.0 — Трекер потребления воды' --notes-file RELEASE_NOTES.md
          fi
