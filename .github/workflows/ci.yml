name: CI - Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate required files
        run: test -s index.html && test -s style.css && test -s model.js && test -s script.js
      - name: Check JavaScript syntax
        run: node --check model.js && node --check script.js
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Test SQLite schema
        run: python3 tests/test_database.py
